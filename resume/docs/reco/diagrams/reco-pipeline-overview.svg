  <text x="26" y="126" font-size="9" fill="#444">· deviceId（始终传）</text>
  <text x="26" y="140" font-size="9" fill="#444">· userId（登录用户加传）</text>
  <text x="26" y="154" font-size="9" fill="#444">· cursor（首页为空）</text>
  <text x="26" y="168" font-size="9" fill="#444">· pageSize（有缺省值）</text>
  <text x="26" y="182" font-size="9" fill="#444">· sceneParams（PLP=池子查询，Feed=无）</text>
  <text x="26" y="200" font-size="9.5" font-weight="bold" fill="#444">服务端确定:</text>
  <text x="26" y="214" font-size="9" fill="#444">· scene（由端点决定）</text>
  <text x="26" y="228" font-size="9" fill="#444">· requestId（入口生成）</text>
  <text x="26" y="242" font-size="9" fill="#444">· variants（AB 实验平台分流）</text>
